llm:
  provider: groq
  model: openai/gpt-oss-20b
  fallback_model: openai/gpt-oss-20b
  temperature: 0.2
  max_tokens: 1000

retrieval:
  min_prs: 3
  max_prs: 10
  branch_prefix_match: true

risk_classifier:
  enabled: true
  # if a diff scores below this, skip LLM generation entirely (template fallback)
  trivial_threshold: 0.15

failure_handling:
  max_retries: 2
  retry_backoff_seconds: 2

ignore_patterns:
  - "*.lock"
  - "poetry.lock"
