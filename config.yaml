llm:
  provider: groq
  model: openai/gpt-oss-20b
  fallback_model: openai/gpt-oss-20b
  temperature: 0.2
  max_tokens: 1000

retrieval:
  min_prs: 3
  max_prs: 10
  branch_prefix_match: true

risk_classifier:
  enabled: true
  trivial_threshold: 0.15
  structural_weight: 0.3

failure_handling:
  max_retries: 2
  retry_backoff_seconds: 2

merge_preview:
  escalate_below_confidence: high
  blast_radius_depth: 2
  worktree_cleanup: true

review:
  lint:
    enabled: true
  agentic:
    enabled: true
    max_context_tokens: 6000
    hops: 2

hooks:
  pre_push:
    block_on_risk: false
  merge_check:
    block_on_risk: false
  post_merge:
    auto_tag: false
    push_tag: false
  commit_msg:
    enabled: true
    
ignore_patterns:
  - "*.lock"
  - "poetry.lock"
