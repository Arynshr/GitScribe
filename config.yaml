llm:
  provider: groq
  model: llama-3.3-70b-versatile
  fallback_model: llama-3.1-8b-instant
  temperature: 0.2
  max_tokens: 1000

retrieval:
  min_prs: 3
  max_prs: 10
  branch_prefix_match: true

risk_classifier:
  enabled: true
  # if a diff scores below this, skip LLM generation entirely (template fallback)
  trivial_threshold: 0.15

failure_handling:
  max_retries: 2
  retry_backoff_seconds: 2

# Extra patterns merged on top of the repo's .gitignore (not a replacement for it).
# Useful for things you don't want git to ignore but also don't want in PR diffs.
ignore_patterns:
  - "*.lock"
  - "poetry.lock"
